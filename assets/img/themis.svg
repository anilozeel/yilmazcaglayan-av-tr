<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1420" role="img" aria-label="Bronz Themis heykeli" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bz" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#1c1209"/>
      <stop offset=".35" stop-color="#5b3a1b"/>
      <stop offset=".5" stop-color="#8a5b2b"/>
      <stop offset=".62" stop-color="#4f3217"/>
      <stop offset="1" stop-color="#140c06"/>
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="1310">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".6" stop-color="#000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="ped" gradientUnits="userSpaceOnUse" x1="160" x2="640" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset=".4" stop-color="#22324f"/>
      <stop offset="1" stop-color="#0a101c"/>
    </linearGradient>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset in="SourceAlpha" dx="7" dy="3" result="off"/>
      <feComposite in="SourceAlpha" in2="off" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="1.6" result="edgeB"/>
      <feFlood flood-color="#f2cf8c"/>
      <feComposite in2="edgeB" operator="in" result="rimL"/>
      <feOffset in="SourceAlpha" dx="-4" dy="0" result="off2"/>
      <feComposite in="SourceAlpha" in2="off2" operator="out" result="edge2"/>
      <feGaussianBlur in="edge2" stdDeviation="1.2" result="edge2B"/>
      <feFlood flood-color="#b8844a" flood-opacity=".55"/>
      <feComposite in2="edge2B" operator="in" result="rimR"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rimR"/><feMergeNode in="rimL"/></feMerge>
    </filter>
  </defs>

  <!-- pedestal -->
  <rect x="215" y="1300" width="370" height="40" fill="url(#ped)"/>
  <rect x="180" y="1340" width="440" height="80" fill="url(#ped)"/>
  <rect x="180" y="1340" width="440" height="2" fill="#C5A059" fill-opacity=".45"/>

  <g filter="url(#rim)">
    <!-- sword -->
    <path d="M552 735 L564 1220 L572 1262 L580 1220 L592 735 Z" fill="#6d4a24"/>
    <rect x="516" y="712" width="112" height="16" rx="7" fill="#5b3a1b"/>
    <rect x="562" y="652" width="20" height="62" rx="9" fill="#4f3217"/>
    <circle cx="572" cy="642" r="14" fill="#5b3a1b"/>

    <!-- scales -->
    <g fill="none" stroke="#a87a42" stroke-width="2">
      <path d="M44 132 L14 286 M44 132 L74 286"/>
      <path d="M296 132 L266 286 M296 132 L326 286"/>
    </g>
    <rect x="34" y="124" width="272" height="9" rx="4.5" fill="#6d4a24"/>
    <rect x="164" y="92" width="11" height="40" rx="5" fill="#5b3a1b"/>
    <circle cx="170" cy="88" r="10" fill="#6d4a24"/>
    <path d="M0 286 L88 286 C83 316 64 330 44 330 C24 330 5 316 0 286 Z" fill="#5b3a1b"/>
    <path d="M252 286 L340 286 C335 316 316 330 296 330 C276 330 257 316 252 286 Z" fill="#5b3a1b"/>

    <!-- raised arm -->
    <path d="M330 392 C300 356 266 322 238 286 C214 252 192 210 176 168" fill="none" stroke="url(#bz)" stroke-width="36" stroke-linecap="round"/>
    <path d="M318 380 C286 356 258 330 236 296" fill="none" stroke="#0e0904" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="172" cy="152" rx="18" ry="22" fill="#6d4a24"/>
    <!-- sleeve drape on raised arm -->
    <path d="M318 360 C300 392 282 420 262 436 C286 430 310 414 334 398 Z" fill="#3e2711"/>

    <!-- robe -->
    <path fill="url(#bz)" d="M376 344 C352 350 330 360 312 378 C298 420 298 470 310 520 C322 566 336 610 330 662
      C314 790 284 960 262 1100 C252 1170 240 1240 232 1302 L568 1302 C560 1240 548 1170 538 1100
      C516 960 488 790 474 662 C468 610 480 566 492 520 C504 470 504 420 490 378 C472 360 448 350 424 344 Z"/>
    <path fill="url(#shade)" d="M376 344 C352 350 330 360 312 378 C298 420 298 470 310 520 C322 566 336 610 330 662
      C314 790 284 960 262 1100 C252 1170 240 1240 232 1302 L568 1302 C560 1240 548 1170 538 1100
      C516 960 488 790 474 662 C468 610 480 566 492 520 C504 470 504 420 490 378 C472 360 448 350 424 344 Z"/>
    <!-- folds -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#0c0703" stroke-opacity=".45" stroke-width="7">
        <path d="M368 700 C360 880 344 1070 326 1298"/>
        <path d="M404 700 C406 890 410 1080 414 1298"/>
        <path d="M440 700 C452 880 470 1070 488 1298"/>
        <path d="M346 400 C376 460 426 470 470 410"/>
      </g>
      <g stroke="#d9ad6a" stroke-opacity=".28" stroke-width="2.4">
        <path d="M382 700 C378 880 368 1070 356 1298"/>
        <path d="M420 700 C428 890 438 1080 450 1298"/>
        <path d="M352 444 C384 500 430 500 466 452"/>
      </g>
    </g>
    <!-- belt -->
    <path d="M326 652 C376 672 428 672 480 652 L478 676 C428 694 376 694 328 676 Z" fill="#6d4a24"/>

    <!-- lowered arm -->
    <path d="M482 392 C514 450 532 540 544 620 C548 660 556 690 570 712" fill="none" stroke="url(#bz)" stroke-width="36" stroke-linecap="round"/>
    <ellipse cx="572" cy="716" rx="22" ry="18" fill="#5b3a1b"/>

    <!-- neck & head -->
    <path d="M380 314 L420 314 L426 352 C410 362 390 362 374 352 Z" fill="#5b3a1b"/>
    <ellipse cx="400" cy="190" rx="32" ry="24" fill="#4f3217"/>
    <ellipse cx="400" cy="260" rx="48" ry="60" fill="url(#bz)"/>
    <path d="M352 244 C356 202 380 190 400 190 C424 190 444 204 448 244 C436 222 418 214 400 214 C382 214 362 222 352 244 Z" fill="#3e2711"/>
    <path d="M351 246 C382 238 418 238 449 246 L449 266 C418 258 382 258 351 266 Z" fill="#8a5b2b"/>
    <path d="M446 250 C472 260 490 282 502 312 C488 298 474 290 460 284 C470 298 476 314 478 330 C464 310 454 290 444 268 Z" fill="#6d4a24"/>
  </g>
</svg>
